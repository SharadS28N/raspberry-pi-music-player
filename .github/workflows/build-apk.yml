name: Build OpenAamps Android APK Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Run code analysis
        run: |
          cd mobile
          flutter analyze

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release --build-name=2.6.0 --build-number=260

      - name: Rename & Stage APK Artifact
        run: |
          mkdir -p bin
          cp mobile/build/app/outputs/flutter-apk/app-release.apk bin/OpenAamps-v2.6.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAamps-v2.6.0-APK
          path: bin/OpenAamps-v2.6.0.apk

      - name: Create GitHub Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/OpenAamps-v2.6.0.apk
          body: "OpenAamps v2.6.0 Standalone Android Mobile Music Player & pi-aamps Hub APK."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
